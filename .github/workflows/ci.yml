name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-java:
    name: Backend (Java · Spring Boot)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: pingpong_recommendation
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
      - name: 初始化数据库结构与演示数据
        run: mysql -h 127.0.0.1 -uroot -proot pingpong_recommendation < database/schema.sql
      - name: 编译并运行测试
        working-directory: backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: pingpong_recommendation
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: "6379"
          REDIS_ENABLED: "true"
          JWT_SECRET: ci-only-secret
        run: mvn -B -ntp test

  backend-python:
    name: Backend (Python · FastAPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend-py/requirements.txt
      - name: 安装依赖
        working-directory: backend-py
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: 运行 pytest
        working-directory: backend-py
        run: python -m pytest

  frontend:
    name: Frontend (Vue 3 · Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        working-directory: frontend
        run: npm ci
      - name: 生产构建
        working-directory: frontend
        run: npm run build
